<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sin conexión</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
        background: #080909;
        color: #f4f0e8;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .wrap { max-width: 380px; }
      .chip {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 18px;
        display: grid;
        place-items: center;
        background: rgba(7, 141, 242, 0.14);
        border: 1px solid rgba(7, 141, 242, 0.3);
      }
      .chip svg { width: 30px; height: 30px; stroke: #078df2; }
      h1 { font-size: 1.35rem; margin: 0 0 8px; letter-spacing: -0.02em; }
      p { margin: 0 0 24px; line-height: 1.6; color: #c4bbae; }
      button {
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        border: 0;
        border-radius: 12px;
        padding: 12px 22px;
        color: #04121f;
        background: #078df2;
      }
      button:active { transform: translateY(1px); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="chip" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 1l22 22" />
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9" />
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
          <line x1="12" y1="20" x2="12.01" y2="20" />
        </svg>
      </div>
      <h1>Sin conexión</h1>
      <p>No hemos podido cargar esta pantalla. Revisa tu conexión e inténtalo de nuevo — tus datos guardados siguen a salvo.</p>
      <button onclick="location.reload()">Reintentar</button>
    </div>
  </body>
</html>
