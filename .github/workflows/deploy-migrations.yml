name: Deploy Supabase migrations

# Applies supabase/migrations/** to the production Supabase project whenever
# migrations land on main. `supabase db push` is idempotent: it only runs
# migrations not yet recorded in the remote project, so re-runs are safe.
on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    # Secrets live in the "PerformLabs" GitHub Environment; declaring it here lets
    # the job read them via secrets.*.
    environment: PerformLabs
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Apply migrations to production
        run: supabase db push
